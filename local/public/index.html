<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Beacon Control Tower</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0b1220;--card:#121c31;--line:#22314f;--tx:#e6edf7;--mut:#8fa3c4;--blue:#2e9bff;--grn:#2ecc8f;--amb:#f5b942;--red:#ff5d6c;--vio:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0f1d3a,#0b1220)}
.logo{width:34px;height:34px;border-radius:9px;background:conic-gradient(var(--blue),var(--vio),var(--grn),var(--blue));display:grid;place-items:center;font-weight:800;color:#0b1220}
h1{font-size:17px;margin:0}small,.mut{color:var(--mut)}nav{display:flex;gap:4px;padding:8px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}nav button.on{background:var(--card);color:var(--tx);box-shadow:inset 0 -2px var(--blue)}
main{padding:18px 22px;max-width:1300px;margin:auto}.grid{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:1.25fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12px}
.pill{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}.AUTO_CLOSED,.APPROVED,.pass{background:#12382d;color:var(--grn)}.ASSIGNED,.New{background:#14304d;color:var(--blue)}
.PENDING_APPROVAL{background:#40330f;color:var(--amb)}.BLOCKED,.REJECTED,.fail{background:#451a22;color:var(--red)}
button.b{background:var(--blue);color:#04101f;border:0;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}button.b.g{background:var(--grn)}button.b.r{background:var(--red)}button.b.o{background:#24365a;color:var(--tx)}
.trace{font-family:Consolas,monospace;font-size:12.5px}.trace div{padding:5px 0;border-bottom:1px dashed var(--line);animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(4px)}}
.tool{color:var(--vio)}.ms{color:var(--mut)}input[type=range]{width:100%}.bar{height:10px;border-radius:6px;background:#1b2a47;overflow:hidden}.bar i{display:block;height:100%;background:var(--grn)}
.hide{display:none}h2{font-size:15px;margin:0 0 10px}code{background:#0b1426;padding:1px 5px;border-radius:4px}.amb{color:var(--amb)}.unc{color:var(--vio)}
svg text{fill:var(--tx);font-size:12px}
.seg{display:inline-flex;background:#0b1426;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;vertical-align:middle}.seg button{background:none;border:0;color:var(--mut);padding:5px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
.seg button.on{background:var(--blue);color:#04101f}.seg button.on.v2{background:var(--grn)}.tb{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.v1c{color:var(--amb)}.v2c{color:var(--grn)}.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cmp>div{border:1px solid var(--line);border-radius:10px;padding:10px;background:#0e1830}.cmp>div.w{border-color:var(--grn)}
.mr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}.mr.d{background:#1a2a14;margin:0 -6px;padding:4px 6px;border-radius:6px}.mr{gap:12px}.mr b{text-align:right;word-break:break-word}.mr span:first-child{color:var(--mut);white-space:nowrap}
.pill.diff{background:#40330f;color:var(--amb)}.pill.same{background:#1b2a47;color:var(--mut)}.pill.v1{background:#40330f;color:var(--amb)}.pill.v2{background:#12382d;color:var(--grn)}
.cmpbar{height:12px;border-radius:6px;background:#1b2a47;overflow:hidden;margin:4px 0 10px}.cmpbar i{display:block;height:100%}tr.sel td{background:#162545}.sm{font-size:12px}
</style></head><body>
<header><div class="logo">B</div><div><h1>Beacon &mdash; Agentic GRC Control Tower</h1><small>Forward-deployed reference build &middot; Salesforce Agentforce pattern &middot; runs 100% locally</small></div>
<div style="margin-left:auto;display:flex;gap:10px;align-items:center"><span id="mode" class="pill New">...</span><button class="b o" onclick="reset()">Reset demo</button></div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const TABS=['Mission Control','V1 vs V2 Lab','Data Pipeline','Prompt Evals','ROI','Ambiguity vs Uncertainty','Architecture','Salesforce Mapping'];
let S=null,tab=0,sel=null,prompt='v2',ev={},MODE=null,last='',err='',CMP=null,view='trace',tok=0;
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild};
const api=async(u,m)=>(await fetch(u,{method:m||'GET'})).json();
const pill=s=>`<span class="pill ${s}">${s}</span>`;
async function load(){try{const m=await api('/api/mode');MODE=m;const el=document.getElementById('mode');
if(m.mode==='salesforce'){el.className='pill AUTO_CLOSED';el.textContent='LIVE: Salesforce org '+m.url.replace('https://','')}else{el.className='pill PENDING_APPROVAL';el.textContent='LOCAL sandbox (not connected to an org)'}
S=await api('/api/state');if(S.error)throw new Error(S.error);err='';last=JSON.stringify(S);render()}catch(e){err=e.message;document.getElementById('main').innerHTML='<div class="card"><h2>Cannot load data</h2><p class="amb">'+err+'</p></div>'}}
async function poll(){if(!MODE||MODE.mode!=='salesforce'||document.hidden)return;try{const n=await api('/api/state');if(n.error)return;const j=JSON.stringify(n);if(j!==last){last=j;S=n;if(tab==0)render()}}catch(e){}}
setInterval(poll,4000);
async function reset(){const n=await api('/api/reset','POST');if(n.error){alert(n.error);return}S=n;last=JSON.stringify(n);sel=null;render()}
function nav(){document.getElementById('nav').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};render()">${t}</button>`).join('')}
function kpis(){const k=S.kpis;const c=(v,l,col)=>`<div class="card kpi"><b style="color:${col||'inherit'}">${v}</b><span>${l}</span></div>`;
return `<div class="grid k">${c(k.processed+'/'+k.total,'findings triaged')}${c(k.autoClosed,'auto-closed (touchless)','var(--grn)')}${c(k.pending,'awaiting human approval','var(--amb)')}${c(k.blocked,'blocked by guardrail','var(--red)')}${c(k.hoursSaved+' h','analyst time saved')}${c('$'+k.dollarsSaved,'value @ $85/h')}${c(k.avgLatencyMs+' ms','avg agent latency')}${c(k.overrideRate+'%','human override rate')}</div>`}
const CAT=r=>`<code>${r.category}</code>`;
const mr=(l,a,b,fmt)=>{const f=fmt||(x=>x);return `<div class="mr${a!==b?' d':''}"><span>${l}</span><b>${f(a)}</b></div>`};
function pv(v){return `<span class="pill ${v}">${v}</span>`}
function setP(v){prompt=v;render()}
function seg(){return `<span class="seg"><button class="${prompt=='v1'?'on':''}" onclick="setP('v1')">v1</button><button class="${prompt=='v2'?'on v2':''}" onclick="setP('v2')">v2</button></span>`}
function runCard(r,v,exp,win){return `<div class="${win?'w':''}"><div class="tb" style="margin:0 0 6px"><b class="${v}c">Prompt ${v}</b>${exp?pill(r.category===exp?'pass':'fail').replace('>pass<','>matches golden<').replace('>fail<','>misses golden<'):''}</div>
${pill(r.status)}<div style="height:6px"></div>${[['Category',r.category],['Score',r.score+' ('+r.band+')'],['Confidence',r.confidence],['Guardrail',r.guardrails.join(', ')||'none'],['Owner',r.owner],['Latency',r.latencyMs+' ms'],['Est. tokens',r.tokens],['Analyst-min saved',r.minutesSaved]].map(x=>`<div class="mr"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}
function cmpDetail(c){const a=c.v1,b=c.v2,ex=c.expected;
const rowsD=[['Category',a.category,b.category],['Score',a.score,b.score],['Confidence',a.confidence,b.confidence],['Decision',a.status,b.status],['Latency (ms)',a.latencyMs,b.latencyMs],['Est. tokens',a.tokens,b.tokens],['Analyst-min saved',a.minutesSaved,b.minutesSaved]];
const verdict=!c.categoryChanged&&!c.outcomeChanged?'<span class="pill same">identical decision</span>':(c.outcomeChanged?'<span class="pill diff">outcome changed</span> ':'')+(c.categoryChanged?'<span class="pill diff">category changed</span>':'');
const step=(r,v)=>r.steps.filter(s=>s.tool=='classify_llm'||s.tool=='policy_guardrail').map(s=>`<div class="sm"><span class="tool">${s.tool}</span> <span class="ms">${s.ms}ms</span><br>&rarr; ${s.output}</div>`).join('');
return `<div class="tb"><h2 style="margin:0">${c.id} &mdash; ${c.title}</h2><span>${verdict}${ex?` <span class="pill New">golden: ${ex}</span>`:''}</span></div><p class="mut">${c.description}</p>
<div class="cmp">${runCard(a,'v1',ex,ex&&a.category===ex&&b.category!==ex)}${runCard(b,'v2',ex,ex&&b.category===ex&&a.category!==ex)}</div>
<div class="card" style="margin-top:10px;background:#0e1830"><h2 class="sm">What changed, v1 &rarr; v2</h2>${rowsD.filter(r=>r[1]!==r[2]).map(r=>`<div class="mr d"><span>${r[0]}</span><b><span class="v1c">${r[1]}</span> &rarr; <span class="v2c">${r[2]}</span></b></div>`).join('')||'<p class="mut">v1 and v2 produce identical results for this finding.</p>'}</div>
<div class="cmp trace" style="margin-top:10px"><div><b class="v1c">v1 reasoning</b>${step(a,'v1')}</div><div><b class="v2c">v2 reasoning</b>${step(b,'v2')}</div></div>
<div style="margin-top:10px;display:flex;gap:8px"><button class="b o" onclick="run('${c.id}','v1')">Apply v1 to queue</button><button class="b" style="background:var(--grn)" onclick="run('${c.id}','v2')">Apply v2 to queue</button></div>`}
function mission(){
const rows=S.findings.map(f=>{const r=f.run;return `<tr class="${f.id==sel?'sel':''}" style="cursor:pointer" onclick="pick('${f.id}')"><td>${f.id}</td><td>${f.title}<br><small>${f.source} &middot; ${f.asset} &middot; ${f.severity}</small></td><td>${pill(f.status=='New'?'New':f.status)}</td><td>${r?r.score:''}</td><td>${r?pv(r.promptVersion):''}</td><td style="white-space:nowrap">${f.status=='APPROVED'||f.status=='REJECTED'?'':`<button class="b ${r?'o':''}" onclick="event.stopPropagation();run('${f.id}')">${r?'Re-run '+prompt:'Run '+prompt}</button>`} ${f.status=='PENDING_APPROVAL'?`<button class="b g" onclick="event.stopPropagation();dec('${f.id}','approve')">Approve</button> <button class="b r" onclick="event.stopPropagation();dec('${f.id}','reject')">Reject</button>`:''}</td></tr>`}).join('');
const f=S.findings.find(x=>x.id==sel),c=f&&CMP&&CMP.rows.find(x=>x.id==sel);
let side;
if(!f)side='<p class="mut">Select a finding, or press <b>Run agent on all</b>. Use the <b>v1 / v2</b> switch to choose the prompt, or <b>Compare v1 vs v2</b> to see both side by side with no reset.</p>';
else{const tabs=`<div class="tb"><span class="seg"><button class="${view=='trace'?'on':''}" onclick="view='trace';render(true)">Reasoning trace</button><button class="${view=='cmp'?'on':''}" onclick="setView('cmp')">Compare v1 vs v2</button></span></div>`;
 side=tabs+(view=='cmp'?(c?cmpDetail(c):'<p class="mut">Loading comparison...</p>'):`<h2>${f.id} &mdash; ${f.title}</h2><p class="mut">${f.description}</p>`+(f.run?`<div class="trace" id="trace"></div>`:'<p class="mut">Not triaged yet. Press <b>Run '+prompt+'</b>, or open <b>Compare v1 vs v2</b> for a side-by-side without changing the queue.</p>'))}
return kpis()+`<div class="grid two" style="margin-top:14px"><div class="card"><div class="tb"><h2 style="margin:0">Finding queue</h2><span>prompt ${seg()} <button class="b" onclick="runAll()">Run agent on all (${prompt})</button> <button class="b o" onclick="tab=1;render()">Compare v1 vs v2</button></span></div><table><tr><th>ID</th><th>Finding</th><th>Status</th><th>Risk</th><th>Prompt</th><th></th></tr>${rows}</table></div><div class="card" id="side">${side}</div></div>`}
async function ensureCmp(){if(!CMP)CMP=await api('/api/compare')}
async function pick(id){sel=id;await ensureCmp();render(false)}
async function setView(v){view=v;await ensureCmp();render()}
function showTrace(animate){const my=++tok;const f=S.findings.find(x=>x.id==sel);if(view!='trace'||!f||!f.run)return;const r=f.run,t=document.getElementById('trace');if(!t)return;t.innerHTML='';
const items=r.steps.map(s=>`<div><span class="tool">${s.tool}</span>(${s.input}) <span class="ms">${s.ms}ms</span><br>&rarr; ${s.output}</div>`);
items.push(`<div><b>Decision:</b> ${pill(r.status)} category <code>${r.category}</code> score <b>${r.score}</b> (${r.band}) confidence <b>${r.confidence}</b><br><b>Owner:</b> ${r.owner}<br><b>Recommendation:</b> ${r.recommendation}<br><small>${r.tokens} est. tokens &middot; ${r.latencyMs} ms &middot; ${r.minutesSaved} analyst-min saved &middot; prompt ${pv(r.promptVersion)}</small></div>`);
items.forEach((h,i)=>{const go=()=>{if(my===tok)t.appendChild($(h))};animate?setTimeout(go,i*450):go()})}
async function run(id,ver){if(ver)prompt=ver;sel=id;view='trace';const r=await api(`/api/findings/${id}/run?prompt=${prompt}`,'POST');if(r.error){alert(r.error);return}S=await api('/api/state');last=JSON.stringify(S);render(true)}
async function runAll(){for(const f of S.findings.filter(x=>x.status!='APPROVED'&&x.status!='REJECTED')){await api(`/api/findings/${f.id}/run?prompt=${prompt}`,'POST')}S=await api('/api/state');last=JSON.stringify(S);render()}
const bar=(a,b,max,fmtv)=>`<div class="sm"><span class="v1c">v1 ${fmtv(a)}</span></div><div class="cmpbar"><i style="width:${Math.min(100,a/max*100)}%;background:var(--amb)"></i></div><div class="sm"><span class="v2c">v2 ${fmtv(b)}</span></div><div class="cmpbar"><i style="width:${Math.min(100,b/max*100)}%;background:var(--grn)"></i></div>`;
async function lab(){await ensureCmp();const m=document.getElementById('main');if(tab!=1)return;const s=CMP.summary,a=s.v1,b=s.v2,p=x=>x+'%',n=x=>x;
const tile=(t,x,y,fm,max,good)=>`<div class="card"><h2 class="sm mut">${t}</h2>${bar(x,y,max,fm)}</div>`;
const rows=CMP.rows.map(r=>`<tr class="${r.id==sel?'sel':''}" style="cursor:pointer" onclick="sel='${r.id}';lab()"><td>${r.id}</td><td>${r.title}<br><small>${r.severity} &middot; golden: ${r.expected||'n/a'}</small></td><td>${r.v1.category}${r.expected?(r.v1.category==r.expected?' &#10003;':' &#10007;'):''}<br><small>${r.v1.score} &middot; ${r.v1.status}</small></td><td>${r.v2.category}${r.expected?(r.v2.category==r.expected?' &#10003;':' &#10007;'):''}<br><small>${r.v2.score} &middot; ${r.v2.status}</small></td><td>${r.outcomeChanged?'<span class="pill diff">outcome</span>':r.categoryChanged?'<span class="pill diff">category</span>':'<span class="pill same">same</span>'}</td></tr>`).join('');
const c=CMP.rows.find(x=>x.id==sel);
m.innerHTML=`<div class="tb"><div><h2 style="margin:0">Prompt v1 vs v2: same 14 findings, both versions, no reset</h2><small>Each finding is triaged by both prompt versions in parallel (what-if, the live queue and KPIs are not touched). Golden-set labels come from the eval harness.</small></div><button class="b o" onclick="CMP=null;lab()">Refresh</button></div>
<div class="grid k">${tile('Golden-set accuracy',a.passRate,b.passRate,p,100)}${tile('Auto-closed (touchless)',a.autoClosed,b.autoClosed,n,14)}${tile('Sent to "other" bucket',a.otherBucket,b.otherBucket,n,14)}${tile('Avg confidence',a.avgConfidence,b.avgConfidence,n,1)}${tile('Analyst hours saved',a.hoursSaved,b.hoursSaved,n,Math.max(a.hoursSaved,b.hoursSaved,1))}${tile('Avg latency (ms, simulated)',a.avgLatencyMs,b.avgLatencyMs,n,Math.max(a.avgLatencyMs,b.avgLatencyMs,1))}</div>
<div class="card" style="margin-top:14px"><b>${s.categoryChanged}</b> of ${s.total} findings change category and <b>${s.outcomeChanged}</b> change outcome between v1 and v2. v1 ${a.passed}/${a.total} correct vs v2 ${b.passed}/${b.total}. <span class="mut">Caveat: v2 was tuned on this same golden set, so treat its score as a regression gate, not as real-world accuracy.</span></div>
<div class="grid two" style="margin-top:14px"><div class="card"><h2>Per-finding result</h2><table><tr><th>ID</th><th>Finding</th><th class="v1c">v1</th><th class="v2c">v2</th><th>&Delta;</th></tr>${rows}</table></div><div class="card">${c?cmpDetail(c):'<p class="mut">Select a finding to see both reasoning traces side by side.</p>'}</div></div>`}
async function dec(id,d){const r=await api(`/api/findings/${id}/${d}`,'POST');if(r.error){alert(r.error);return}sel=id;S=await api('/api/state');last=JSON.stringify(S);render()}
function pipe(){const m=S.pipeline;return `<div class="grid k">${['received','accepted','quarantined'].map(x=>`<div class="card kpi"><b>${m[x]}</b><span>${x}</span></div>`).join('')}<div class="card kpi"><b>${m.acceptRate}%</b><span>accept rate</span></div></div>
<div class="grid two" style="margin-top:14px"><div class="card"><h2>Quarantine (dead-letter) &mdash; nothing is silently dropped</h2><table><tr><th>Reason</th><th>Raw line</th></tr>${S.quarantine.map(q=>`<tr><td>${pill('fail').replace('fail',q.reason).replace('class="pill '+q.reason,'class="pill fail')}</td><td><code>${q.line.replace(/</g,'&lt;')}</code></td></tr>`).join('')}</table></div>
<div class="card"><h2>Pipeline stages</h2><p>1. <b>Ingest</b> JSONL from Splunk / CloudTrail / ServiceNow / Archer<br>2. <b>Validate</b> required fields, JSON integrity<br>3. <b>Normalise</b> severities (<code>sev3</code>, <code>crit</code>, <code>HIGH</code> &rarr; canonical)<br>4. <b>Dedupe</b> idempotent on <code>External_Id__c</code><br>5. <b>Quarantine</b> bad records with a reason code<br>6. <b>Serve</b> to the agent + KPI mart</p><p class="mut">Salesforce equivalent: Apex REST upsert on External Id (headless) now; Data 360 / Snowflake zero-copy in the scale-out phase.</p></div></div>`}
async function evals(){const a=await api('/api/evals?prompt=v1'),b=await api('/api/evals?prompt=v2');ev={a,b};document.getElementById('main').innerHTML=`<div class="grid two"><div class="card"><h2>Prompt v1 &mdash; <span style="color:var(--red)">${a.passRate}%</span> (${a.passed}/${a.total})</h2>${tbl(a)}</div><div class="card"><h2>Prompt v2 &mdash; <span style="color:var(--grn)">${b.passRate}%</span> (${b.passed}/${b.total})</h2>${tbl(b)}</div></div>
<div class="card" style="margin-top:14px"><h2>Why v1 failed &amp; what changed</h2><p>&bull; <b>Vocabulary gap</b>: v1 only knew &ldquo;exposed&rdquo;, so <code>public-read</code>, <code>0.0.0.0/0</code> and <code>unencrypted</code> fell to <i>other</i> &rarr; added to v2.<br>&bull; <b>Negation blindness</b>: &ldquo;No evidence of malware&rdquo; was labelled malware &rarr; v2 adds a negation pre-check (false-positive path).<br>&bull; <b>Missing category</b>: impossible-travel / MFA-disabled had no identity class &rarr; added.<br>&bull; <b>Process</b>: golden set in CI, regression gate at 95% before any prompt change ships.</p></div>`}
function tbl(e){return `<table><tr><th>ID</th><th>Expected</th><th>Got</th><th></th></tr>${e.rows.map(r=>`<tr><td>${r.id}</td><td>${r.expected}</td><td>${r.got}</td><td>${pill(r.pass?'pass':'fail')}</td></tr>`).join('')}</table>`}
function roi(){const k=S.kpis,sv=k.avgMinutesSaved||13.8;return `<div class="grid two"><div class="card"><h2>Business case calculator <small>(measured saving per finding: ${sv} min from this run)</small></h2>
${sl('vol','Findings / month',4000,500,20000,500)}${sl('rate','Loaded analyst cost $/h',85,40,200,5)}${sl('cost','Agent platform + LLM run cost $/month',6000,0,30000,500)}${sl('auto','Share of volume in scope for agent %',70,10,100,5)}
<p class="mut">Assumptions are inputs, not facts: replace with the sponsor's numbers in discovery.</p></div><div class="card" id="roiout"></div></div>`}
function sl(id,l,v,mn,mx,st){return `<p>${l}: <b id="${id}v">${v}</b><input type="range" id="${id}" min="${mn}" max="${mx}" step="${st}" value="${v}" oninput="calc()"></p>`}
function calc(){const g=i=>+document.getElementById(i).value;['vol','rate','cost','auto'].forEach(i=>document.getElementById(i+'v').textContent=g(i));const sv=S.kpis.avgMinutesSaved||13.8;
const hrs=g('vol')*g('auto')/100*sv/60,gross=hrs*g('rate'),net=gross-g('cost'),roi=g('cost')?net/g('cost')*100:0;const f=n=>'$'+Math.round(n).toLocaleString();
document.getElementById('roiout').innerHTML=`<h2>Monthly outcome</h2><div class="kpi"><b style="color:var(--grn)">${Math.round(hrs).toLocaleString()} h</b><span>analyst hours returned</span></div><div class="kpi"><b>${f(gross)}</b><span>gross value</span></div><div class="kpi"><b style="color:${net>0?'var(--grn)':'var(--red)'}">${f(net)}</b><span>net after run cost</span></div><div class="kpi"><b>${Math.round(roi)}%</b><span>ROI</span></div><div class="kpi"><b>${net>0?(g('cost')/ (gross/30) ).toFixed(0)+' days':'n/a'}</b><span>cost recovered in (days of savings)</span></div><p class="mut">Value is capacity redeployed to higher-risk work (not headcount cut) &mdash; the framing a CISO / CFO accepts.</p>`}
function amb(){const R=[['What counts as &ldquo;Critical&rdquo;?','Ambiguity','Someone knows. Ask the CISO. Decided: score &ge; 75 (ADR-003).'],['Which findings may auto-close?','Ambiguity','Workshop with SOC lead. Low band + confidence &ge; 0.85 + no PII.'],['Which systems are PII?','Ambiguity','Pull from the data catalog; mirrored in Asset.Contains_PII__c.'],['Will classification hold on log sources we have not seen?','Uncertainty','Cannot be answered by asking. Golden-set evals + 2-week shadow mode + drift alert.'],['Will analysts trust auto-close?','Uncertainty','Staged autonomy: L0 suggest &rarr; L1 approve &rarr; L2 auto-close. Track override rate.'],['Volume during a real incident?','Uncertainty','Queue + back-pressure, load test at 10x, reversible decisions only.']];
return `<div class="card"><h2>Framing requirements: <span class="amb">ambiguity</span> vs <span class="unc">uncertainty</span></h2><p><b class="amb">Ambiguity</b> = information exists, nobody wrote it down &rarr; <i>ask / decide / document</i>.<br><b class="unc">Uncertainty</b> = cannot be known yet &rarr; <i>design a cheap experiment, keep decisions reversible, set a trigger to revisit</i>.</p><table><tr><th>Requirement question</th><th>Type</th><th>How we handled it</th></tr>${R.map(r=>`<tr><td>${r[0]}</td><td class="${r[1]=='Ambiguity'?'amb':'unc'}"><b>${r[1]}</b></td><td>${r[2]}</td></tr>`).join('')}</table></div>`}
function arch(){const box=(x,y,w,t,c)=>`<rect x="${x}" y="${y}" width="${w}" height="52" rx="10" fill="#0b1426" stroke="${c}"/><text x="${x+w/2}" y="${y+31}" text-anchor="middle">${t}</text>`;
return `<div class="card"><h2>Reference architecture (local demo &harr; Salesforce org)</h2><svg viewBox="0 0 1100 330" width="100%">
${box(10,20,170,'Splunk / CloudTrail','#8fa3c4')}${box(10,100,170,'ServiceNow / Archer','#8fa3c4')}
${box(250,60,190,'Ingest API (REST)','#2e9bff')}${box(500,60,200,'Validate · Dedupe · Quarantine','#2e9bff')}
${box(500,170,200,'Triage Agent (topic+actions)','#a78bfa')}${box(760,60,160,'Finding__c / Control__c','#2ecc8f')}${box(760,170,160,'Agent_Run__c telemetry','#2ecc8f')}
${box(250,170,190,'Guardrails · HITL approval','#ff5d6c')}${box(960,115,130,'KPI Dashboard LWC','#f5b942')}${box(500,260,200,'Eval harness (golden set)','#f5b942')}
<g stroke="#8fa3c4" fill="none" marker-end="url(#a)"><path d="M180 46L250 80M180 126L250 90M440 86H500M700 86H760M600 112V170M700 196H760M440 196H500M840 112L960 130M840 196L960 160M600 222V260"/></g>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#8fa3c4"/></marker></defs></svg>
<p class="mut">Every decision above the guardrail line is reversible; every agent step writes telemetry so health and ROI are measurable from day one.</p></div>`}
function sfmap(){const R=[['Triage agent topic + instructions','Agentforce Agent topic &ldquo;Finding Triage&rdquo; (Agent Builder)'],['Tools: get_asset_context, lookup_control, score_risk','Agent actions backed by Apex <code>@InvocableMethod</code> / Flow'],['classify_llm prompt v1&rarr;v2','Prompt Builder template (versioned) + Einstein Trust Layer'],['Guardrails G1&ndash;G4, HITL approval','Topic instructions + Apex policy + Flow approval + Trust Layer masking/audit'],['POST /api/v1/findings','Apex REST <code>/services/apexrest/beacon/v1/findings</code> (headless)'],['Ingest pipeline &amp; KPI mart','Data 360 / Snowflake / Databricks at scale; Apex+SOQL for the playground'],['Mission Control UI','LWC <code>beaconDashboard</code> in a Lightning App Page'],['Eval harness','Agentforce Testing Center / batch tests + golden set in CI']];
return `<div class="card"><h2>Local component &rarr; Salesforce platform component</h2><table><tr><th>This demo</th><th>On the Salesforce Platform</th></tr>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table></div>`}
function render(an){nav();const m=document.getElementById('main'),t=TABS[tab];
if(t=='Mission Control'){m.innerHTML=mission();showTrace(an)}else if(t=='V1 vs V2 Lab')lab();else if(t=='Data Pipeline')m.innerHTML=pipe();else if(t=='Prompt Evals')evals();else if(t=='ROI'){m.innerHTML=roi();calc()}else if(t=='Ambiguity vs Uncertainty')m.innerHTML=amb();else if(t=='Architecture')m.innerHTML=arch();else m.innerHTML=sfmap()}
load();
</script></body></html>
